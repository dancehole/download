<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>摄影师后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/admin.css?v=8">
</head>
<body>
  <!-- 登录 -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark"></span>
        <h1 data-i18n="admin_title">摄影师后台</h1>
      </div>
      <p class="auth-hint" data-i18n="default_account">默认账号 admin / admin123</p>
      <div class="form">
        <label class="field">
          <span class="field-label" data-i18n="username">用户名</span>
          <input type="text" id="loginUser" autocomplete="username">
        </label>
        <label class="field">
          <span class="field-label" data-i18n="password">密码</span>
          <input type="password" id="loginPass" autocomplete="current-password">
        </label>
        <div class="auth-error" id="loginError" hidden></div>
        <button class="btn btn-primary block" id="loginSubmit" type="button" data-i18n="login_btn">登录</button>
      </div>
      <div class="auth-foot">
        <button class="lang-mini" id="langToggle" type="button">
          <span class="lang-opt" data-lang="zh">中文</span><span class="sep">/</span><span class="lang-opt" data-lang="en">EN</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 主应用 -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mark"></span>
        <h1 class="brand" data-i18n="admin_title">摄影师后台</h1>
        <button class="crumb" id="navEvents" type="button" data-i18n="my_events">我的活动</button>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost sm" id="settingsBtn" type="button" data-i18n="settings">设置</button>
        <button class="lang-mini" id="langToggle2" type="button">
          <span class="lang-opt" data-lang="zh">中文</span><span class="sep">/</span><span class="lang-opt" data-lang="en">EN</span>
        </button>
        <button class="btn btn-ghost sm" id="logoutBtn" type="button" data-i18n="logout">退出登录</button>
      </div>
    </header>

    <main class="content">
      <!-- 活动列表视图 -->
      <section class="view" id="viewEvents">
        <div class="toolbar">
          <div class="toolbar-create">
            <input type="text" id="createName" class="input" data-i18n-ph="event_name_ph" placeholder="请输入活动主题">
            <button class="btn btn-primary" id="createBtn" type="button" data-i18n="create">创建</button>
          </div>
          <div class="toolbar-enter">
            <input type="text" id="enterId" class="input mono" data-i18n-ph="event_id_ph" placeholder="输入活动 ID">
            <button class="btn btn-ghost" id="enterBtn" type="button" data-i18n="enter">进入</button>
          </div>
        </div>
        <div class="events-grid" id="eventsGrid"></div>
      </section>

      <!-- 活动详情视图 -->
      <section class="view" id="viewDetail" hidden>
        <button class="back-link" id="backBtn" type="button">‹ <span data-i18n="back">返回</span></button>
        <div class="detail-head">
          <div class="detail-title">
            <h2 id="detailName"></h2>
            <div class="detail-meta">
              <span class="chip mono" id="detailId"></span>
              <span class="chip" id="detailCount"></span>
              <span class="chip" id="detailCreated"></span>
            </div>
          </div>
        </div>

        <div class="share-box">
          <div class="share-row">
            <span class="share-label" data-i18n="share_link">分享链接</span>
            <input type="text" id="shareLink" class="input mono" readonly>
            <button class="btn btn-ghost sm" id="copyShare" type="button" data-i18n="copy">复制</button>
            <button class="btn btn-ghost sm" id="openShare" type="button" data-i18n="open_share">打开分享页</button>
          </div>
          <div class="share-row">
            <button class="btn btn-ghost sm" id="regenBtn" type="button" data-i18n="regen_share">重新生成链接</button>
          </div>
        </div>

        <div class="settings-card">
          <h3 data-i18n="event_settings">相册设置</h3>

          <label class="field">
            <span class="field-label" data-i18n="preview_size">缩略图尺寸</span>
            <select id="previewSizeSelect" class="input">
              <option value="480">480px - 省流量</option>
              <option value="640" selected>640px - 标准</option>
              <option value="800">800px - 高清</option>
            </select>
            <p class="muted" data-i18n="preview_size_desc">新上传的照片将按此尺寸生成缩略图，已有照片不受影响。</p>
          </label>

          <label class="field field-switch">
            <span class="field-label" data-i18n="event_use_oss">使用 OSS 存储</span>
            <label class="switch">
              <input type="checkbox" id="eventUseOss">
              <span class="slider"></span>
            </label>
          </label>
          <p class="muted" data-i18n="event_use_oss_desc">启用后新上传的照片将同时存储到 OSS，需先在全局设置中配置 OSS。</p>

          <button class="btn btn-primary block" id="saveEventSettingsBtn" type="button" data-i18n="save">保存设置</button>
        </div>

        <div class="danger-zone">
          <div class="danger-zone-text">
            <h3 data-i18n="delete_album">删除相册</h3>
            <p class="muted" data-i18n="delete_album_desc">永久删除该相册的所有照片、本地文件和 OSS 远程数据，不可恢复。</p>
          </div>
          <button class="btn btn-danger" id="deleteAlbumBtn" type="button" data-i18n="delete_album">删除相册</button>
        </div>

        <div class="upload-grid">
          <div class="upload-card">
            <h3 data-i18n="upload_photos">上传照片</h3>
            <label class="field">
              <span class="field-label" data-i18n="tag_optional">标签（可选）</span>
              <input type="text" id="uploadTag" class="input" data-i18n-ph="tag_ph" placeholder="如：开幕式">
            </label>
            <label class="field">
              <span class="field-label" data-i18n="tag_en_optional">英文标签（可选，缺省同中文）</span>
              <input type="text" id="uploadTagEn" class="input" data-i18n-ph="tag_en_ph" placeholder="e.g. Opening">
            </label>
            <div class="dropzone" id="dropzoneJpg" tabindex="0">
              <div class="dz-icon">📷</div>
              <div class="dz-text" data-i18n="upload_area_hint">点击或拖拽 JPG 文件到此处</div>
              <div class="dz-files" id="jpgFiles"></div>
              <input type="file" id="jpgInput" accept=".jpg,.jpeg,image/jpeg" multiple hidden>
            </div>
            <button class="btn btn-primary block" id="uploadBtn" type="button" disabled data-i18n="upload_btn">开始上传</button>
          </div>

          <div class="upload-card">
            <h3 data-i18n="upload_raf">上传 RAF 底片</h3>
            <p class="muted" data-i18n="upload_area_hint_raf">点击或拖拽 RAF 文件到此处</p>
            <div class="dropzone" id="dropzoneRaf" tabindex="0">
              <div class="dz-icon">🎞</div>
              <div class="dz-text" data-i18n="upload_area_hint_raf">点击或拖拽 RAF 文件到此处</div>
              <div class="dz-files" id="rafFiles"></div>
              <input type="file" id="rafInput" accept=".raf,.RAF" multiple hidden>
            </div>
            <button class="btn btn-primary block" id="uploadRafBtn" type="button" disabled data-i18n="upload_raf_btn">上传 RAF</button>
          </div>
        </div>

        <div class="photo-section">
          <h3 data-i18n="my_photos">已上传照片</h3>
          <div class="thumb-grid" id="thumbGrid"></div>
        </div>
      </section>

      <!-- 设置视图 -->
      <section class="view" id="viewSettings" hidden>
        <button class="back-link" id="backFromSettings" type="button">‹ <span data-i18n="back">返回</span></button>
        <div class="detail-head">
          <div class="detail-title">
            <h2 data-i18n="settings">设置</h2>
          </div>
        </div>

        <div class="settings-card">
          <h3 data-i18n="oss_settings">OSS 存储设置</h3>
          <p class="muted" data-i18n="oss_settings_desc">启用后，上传的照片将存储到阿里云 OSS，可配合 CDN 加速访问。</p>

          <label class="field field-switch">
            <span class="field-label" data-i18n="oss_enable">启用 OSS 存储</span>
            <label class="switch">
              <input type="checkbox" id="ossEnabled">
              <span class="slider"></span>
            </label>
          </label>

          <label class="field">
            <span class="field-label">AccessKey ID</span>
            <input type="text" id="ossAccessKeyId" class="input" placeholder="如：LTAI5t...">
          </label>

          <label class="field">
            <span class="field-label">AccessKey Secret</span>
            <input type="password" id="ossAccessKeySecret" class="input" placeholder="留空则不修改">
          </label>

          <label class="field">
            <span class="field-label" data-i18n="oss_endpoint">Endpoint 地域节点</span>
            <input type="text" id="ossEndpoint" class="input" placeholder="如：oss-cn-guangzhou.aliyuncs.com">
          </label>

          <label class="field">
            <span class="field-label" data-i18n="oss_bucket">Bucket 名称</span>
            <input type="text" id="ossBucket" class="input" placeholder="如：2026-activity-image">
          </label>

          <label class="field">
            <span class="field-label" data-i18n="oss_custom_domain">自定义域名（可选）</span>
            <input type="text" id="ossCustomDomain" class="input" placeholder="如：cdn.example.com，留空使用默认域名">
          </label>

          <div class="settings-actions">
            <button class="btn btn-ghost" id="testOssBtn" type="button" data-i18n="oss_test">测试连接</button>
            <button class="btn btn-primary" id="saveSettingsBtn" type="button" data-i18n="save">保存设置</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="static/js/i18n.js?v=8"></script>
  <script src="static/js/api.js?v=8"></script>
  <script src="static/js/admin.js?v=8"></script>
</body>
</html>
